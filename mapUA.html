<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa de Municipios y Sedes Uniatlántico</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    
    <style>
        body { margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        #map { width: 100vw; height: 100vh; }
        
        /* Nombres de los municipios sobre su color */
        .etiqueta-mpio span {
            display: block;
            transform: translate(-50%, -50%);
            white-space: nowrap;
            text-align: center;
            font-size: 12px;
            font-weight: 700;
            line-height: 1.15;
            color: #1b1b1b;
            text-shadow: 0 0 3px #fff, 0 0 3px #fff, 0 0 2px #fff;
            pointer-events: none;
        }

        /* Botón "Ver todos" bajo el zoom */
        .btn-encuadre a { font-size: 16px; font-weight: bold; cursor: pointer; }

        /* Leyenda */
        .info-panel {
            padding: 10px 14px;
            font: 12px/16px Arial, Helvetica, sans-serif;
            background: rgba(255, 255, 255, 0.95);
            box-shadow: 0 0 15px rgba(0,0,0,0.25);
            border-radius: 6px;
            color: #333;
        }
        .info-panel h4 { margin: 0 0 6px; color: #111; font-size: 13px; }
        .legend-item { display: flex; align-items: center; margin-bottom: 4px; }
        .color-box { width: 16px; height: 12px; margin-right: 8px; border-radius: 2px; border: 1px solid #444; }
        .marker-icon-sample {
            display: inline-block; width: 10px; height: 10px; border-radius: 50%;
            background-color: #d90429; border: 2px solid #fff; margin-right: 8px;
        }
    </style>
</head>
<body>

<div id="map"></div>

    // Área de un anillo [lon, lat] (fórmula del polígono / shoelace)
    function areaAnillo(anillo) {
        let a = 0;
        for (let i = 0, j = anillo.length - 1; i < anillo.length; j = i++) {
            a += anillo[j][0] * anillo[i][1] - anillo[i][0] * anillo[j][1];
        }
        return Math.abs(a / 2);
    }

        for (let i = 0, j = anillo.length - 1; i < anillo.length; j = i++) {
            const [xi, yi] = anillo[i], [xj, yj] = anillo[j];
            if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) dentro = !dentro;
        }
        return dentro;
    }

    function distanciaAlBorde(x, y, anillo) {
        let min = Infinity;
        for (let i = 0, j = anillo.length - 1; i < anillo.length; j = i++) {
            const [ax, ay] = anillo[j], [bx, by] = anillo[i];
            const dx = bx - ax, dy = by - ay;
            const t = Math.max(0, Math.min(1, ((x - ax) * dx + (y - ay) * dy) / (dx * dx + dy * dy || 1)));
            min = Math.min(min, Math.hypot(x - (ax + t * dx), y - (ay + t * dy)));
        }
        return min;
    }

    // Punto para la etiqueta: el punto más alejado del borde dentro de la parte más grande del municipio,
    // así el nombre siempre queda sobre el color aunque el municipio tenga forma irregular (p. ej. Calamar)
    function puntoEtiqueta(geometry) {
        const partes = geometry.type === 'Polygon' ? [geometry.coordinates] : geometry.coordinates;
        const anillo = partes.map(p => p[0]).reduce((max, r) => (areaAnillo(r) > areaAnillo(max) ? r : max));
        const xs = anillo.map(c => c[0]), ys = anillo.map(c => c[1]);
        const minX = Math.min(...xs), maxX = Math.max(...xs), minY = Math.min(...ys), maxY = Math.max(...ys);
        const pasos = 40;
        let mejor = null, mejorDist = -1;
        for (let i = 1; i < pasos; i++) {
            for (let j = 1; j < pasos; j++) {
                const x = minX + (maxX - minX) * i / pasos, y = minY + (maxY - minY) * j / pasos;
                if (!dentroDeAnillo(x, y, anillo)) continue;
                const d = distanciaAlBorde(x, y, anillo);
                if (d > mejorDist) { mejorDist = d; mejor = [y, x]; }
            }
        }
        return mejor;
    }

    const municipiosLayer = L.geoJSON(municipiosGeoJSON, {
        style: function(feature) {
            const props = feature.properties;
            return {
                fillColor: props.color,
                fillOpacity: 0.45,
                color: props.border,
                weight: 2
            };
        },
        onEachFeature: function(feature, layer) {
            const props = feature.properties;
            layer.bindPopup(`<b>${props.nombre}</b><br>Departamento: <b>${props.dpto}</b>`);

            // Nombre permanente sobre el área (sin el texto entre paréntesis para que sea corto)
            const etiqueta = props.nombre.replace(/\s*\(.*\)$/, '');
            L.marker(puntoEtiqueta(feature.geometry), {
                icon: L.divIcon({ className: 'etiqueta-mpio', html: `<span>${etiqueta}</span>`, iconSize: null }),
                interactive: false,
                keyboard: false
            }).addTo(map);
        }
    }).addTo(map);

    // Ajusta la vista para que se vean todos los municipios
    function encuadrarMunicipios() {
        map.fitBounds(municipiosLayer.getBounds(), { padding: [20, 20] });
    }
    encuadrarMunicipios();

    // Botón "Ver todos" bajo los controles de zoom
    const btnEncuadre = L.control({ position: 'topleft' });
    btnEncuadre.onAdd = function () {
        const div = L.DomUtil.create('div', 'leaflet-bar btn-encuadre');
        div.innerHTML = '<a href="#" title="Ver todos los municipios" role="button">&#x2922;</a>';
        L.DomEvent.on(div.firstChild, 'click', function (e) {
            L.DomEvent.preventDefault(e);
            encuadrarMunicipios();
        });
        return div;
    };
    btnEncuadre.addTo(map);

    // Marcadores de las Sedes de la Universidad del Atlántico
    const sedes = [
        { name: "Sede Norte (Principal)", dir: "Km 7 Vía Puerto Colombia", coords: [11.0188, -74.8735] },
        { name: "Sede Centro", dir: "Cra 43 # 50-53, Barranquilla", coords: [10.9852, -74.7891] },
        { name: "Sede Bellas Artes y Museo", dir: "Calle 68 # 53-45, Barranquilla", coords: [10.9981, -74.8032] },
        { name: "Sede Soledad", dir: "Calle 33 # 35A-02, Soledad", coords: [10.9324, -74.7731] },
        { name: "Sede Regional Centro", dir: "Sabanalarga", coords: [10.6321, -74.9215] },
        { name: "Sede Regional Sur", dir: "Suan", coords: [10.3325, -74.8812] }
    ];

    sedes.forEach(s => {
        L.circleMarker(s.coords, {
            radius: 8,
            fillColor: "#d90429",
            color: "#ffffff",
            weight: 2,
            fillOpacity: 1
        }).addTo(map).bindPopup(`
            <div style="font-size:12px;">
                <b style="color:#d90429;">Universidad del Atlántico</b><br>
                <b>${s.name}</b><br>
                <span style="color:#555;">${s.dir}</span>
            </div>
        `);
    });

    // Leyenda de Colores
    const legend = L.control({ position: 'bottomright' });
    legend.onAdd = function () {
        const div = L.DomUtil.create('div', 'info-panel');
        div.innerHTML = `
            <h4>Convenciones</h4>
            <div class="legend-item"><div class="color-box" style="background:#0a9396; border-color:#005f73;"></div> Atlántico</div>
            <div class="legend-item"><div class="color-box" style="background:#ee9b00; border-color:#ca6702;"></div> Bolívar</div>
            <div class="legend-item"><div class="color-box" style="background:#55a630; border-color:#2b9348;"></div> Magdalena</div>
            <hr style="margin: 6px 0; border: 0; border-top: 1px solid #ccc;">
            <div class="legend-item"><div class="marker-icon-sample"></div> Sedes Uniatlántico</div>
        `;
        return div;
    };
    legend.addTo(map);
</script>

</body>
